Lesson 1 
1
It’s raining. But is it pouring: zaa-zaa? Or shito-shito? Or potsuri-potsuri? 
These words, onomatopoeia, evoke images in our minds. Our ALT will guide us through 
the world of onomatopoeia.
Good morning. Welcome to the exciting world of onomatopoeia! Maybe you are 
wondering, “What’s that fancy word?” Well, it’s basically about sounds — like buzz for a 
bee or splash for water. (1)Onomatopoeia helps us create vivid images in our minds.
(2)Japanese is famous for having a wide range of onomatopoeic words. You often 
come across them in manga, anime, and even in the names of snacks. Snack names often 
include words like saku-saku, pari-pari, and fuwa-fuwa. When you hear saku-saku, what 
comes to mind? Maybe cookies. And pari-pari? Perhaps rice crackers. What about fuwa-
fuwa? Probably something soft, like a pancake.
(3)Using these words truly adds flavor to our lives. When you hear these words, 
you may want to eat something delicious. Onomatopoeia is all around us and adds a 
touch of magic to our language and experiences. (4)It makes our everyday life more 
exciting.
Onomatopoeia is something special in the world of words. For most words, there 
is no natural connection between their sounds and meanings. For example, the word for 
a cat doesn’t have to be cat; it could be neko, like in Japanese. But in the case of 
onomatopoeia, there is a close connection between sounds and meanings. This means 
that onomatopoeia can help people understand each other across language boundaries.
Let’s compare onomatopoeic pairs in Japanese and English in Table 1. You will Lesson 1 
2
notice that some of the sounds are quite similar. (5)But this is not always the case.
Actually, onomatopoeic words with similar sounds in Japanese and English are 
rather rare. (6)In fact, most onomatopoeic words sound different in the two languages. 
Check out the examples in Table 2.
(7)At first, speakers of Japanese may find English onomatopoeia rather strange. 
As you get used to it, it will start to appeal to your senses. So, give it a try, and you’ll start 
to enjoy and understand it better over time.
The difference between Japanese and English onomatopoeia goes beyond just 
sounds. In Japanese, verbs are often paired with onomatopoeic words. They act like 
adverbs to describe manners of action. (8)As you can see in Table 3, the basic verb aruku, 
plus an onomatopoeic word to modify it, shows its unique manner of walking. On the other

You can find similar differences in expressions of laughter. Take a look at Table 
4.
Well, class, that’s it for today. We have seen that Japanese and English use

Ikee Rikako began to swim at a very young age. At age 18, she was already a 
famous competitive swimmer. However, her life had its share of ups and downs. Here’s 
her story.
“Swimming has always been my passion,” Ikee Rikako once said. From a young 
age, she showed extraordinary talent in swimming. She set record after record and made 
a name for herself in the sport. (10)Her achievements in swimming made her a rising star. 
She said, “I’ve always loved the water. It has become my second home.”
At age 18, Ikee won six gold medals at the 2018 Asian Games in Indonesia. 
Everything was going well for her. She never imagined that her journey was about to take 
an unexpected turn.
In early 2019, she was not feeling well at the training camp in Australia, so she 
came back to Japan for a physical checkup. (11)The doctor told her that she had leukemia, 
and she was hospitalized right away.
The treatment was very hard on Ikee. (12)It took away so much of her strength 
that she had to struggle even to get up. She said, “It felt tiring even to be alive.” Once, 
when she was in great pain, a terrible thought came to her: “I might as well be dead.”
Ikee lost more than 15 kilograms and felt very weak. However, with the support 
of many people—her family, friends, and medical staff—she was released from the 
hospital in December 2019. Even though she still lacked strength, she found joy in her 
heart. “Now, I can take care of myself and walk without help,” she said. (13)Simply being 
able to perform everyday tasks brought her happiness. Lesson 2 
Ikee began physical training. In March 2020, (14)her doctor allowed her to enter 
a swimming pool for the first time in 406 days. However, she had a hard time keeping up 
with her teammates. This frustrated her, but she is not the type of person to give up 
easily. She was determined to move forward.
(15)At the same time, Ikee realized that she owed a lot to her teammates. On July 
4, 2020, she received a birthday message from them:
You can laugh even when things are hard. We love you, Rikako. 
But now you’re crying because things are hard. 
Still, we love you, Rikako. 
You can count on us until the end of time. 
One day, together again, we will laugh and laugh!
The meaning of swimming for Ikee totally changed through her hardships. 
Before her illness, her goal was simple and clear: to become the best swimmer in the 
world. She said, “I assumed I could just focus on swimming and live as I pleased. My only 
goal was to become stronger.”
As she recovered from her illness, Ikee discovered a new sense of self. She said, 
“I’ve been thinking a lot about my hardships. Did I learn anything from that experience? 
Yes, I can now empathize with so many people. Just being alive is an extraordinary 
experience.” With these thoughts, she hopes to inspire people by showing that she has 
returned to swimming.
In August 2020, Ikee made her comeback at a competitive swimming meet. In Lesson 2 
October of the same year, she took part in Japan’s Inter College Swimming 
Championships. She finished fourth in the women’s 50-meter freestyle but this was a 
remarkable achievement for her. It was only her second swimming meet since her release 
from the hospital in December 2019.
Ikee said, “To overcome adversity, we need hope more than anything else.” She 
added, “A flickering flame of hope in the distance allows us to move forward, regardless 
of the challenges.”
(16)Her determination in the face of adversity inspires us all to overcome our 
own challenges. Through her comeback, she has become a symbol of hope. (17)Her story 
has been serving, and will continue to serve, as an example of the extraordinary power of 
the human spirit.

a very dangerous place. People were dying every day. (25)I saw shell holes everywhere 
and buildings destroyed by bombs.
Mariupol was not a safe place for an art project. But to my surprise, when I

We painted a big mitten. The idea is based on a popular Ukrainian story, The
Mitten. In the story, one snowy night, an old man drops his mitten. A mouse, a frog, 
a rabbit, a fox, a wolf, and many other animals climb into the mitten to stay warm.
In our painting, you see people from all over the world sharing the warmth of a

I still do not have a clear answer to the question: Who am I as a person and as an

Plastic is one of the major causes of ocean pollution. While he was still a high school 
student in the Netherlands, Boyan Slat decided to do something about it.
In 2011, when I was 16, I went diving in Greece. I was excited to experience 
the beautiful ocean. However, it was totally different from my expectations: I saw more 
plastic waste than fish. I asked myself, “Why can’t we just clean this up?” Maybe I 
was being naive, but I decided to give it a try.
By 2013, I had founded an NPO, The Ocean Cleanup. Our mission is to 
remove plastic from the oceans. Our target is a huge area in the North Pacific Ocean, 
one of the major sites of plastic waste accumulation.
(26)After some difficulties, we got our system to work in 2021. Two boats 
collect plastic by pulling a barrier through the water. The waste is pulled out and taken 
to shore for recycling.
We are still at the pilot stage, but we are making progress. We’ve removed more 
than 0.2 percent of the plastic in the target area. (27)We still don’t know exactly how 
long the project will take. However, at this rate it will take us 500 years. There must 
be a better way.
A better way to stop polluting the oceans with plastic would be to simply reduce 
the use of plastic.
(28)Since the introduction of plastics in the first half of the 20th
 century, the 
demand has increased rapidly. About 400 million tons of plastic is produced each year. 
It weighs more than 1,000 Empire State Buildings. And somewhere between 9 million Lesson 4 
and 14 million tons is believed to enter rivers, lakes, and oceans each year.
(29)Reducing the amount of plastic we use will be difficult because we cannot do 
without plastic in our daily lives. As the world’s population increases and more people 
start to enjoy modern life, the demand for plastic will naturally grow. (30)According to 
some researchers, the use of plastic will become three times greater by 2060.
Canada and the EU have banned “single use” of certain plastic items. But this 
will reduce consumption only in a small way. It will be nearly impossible to reduce 
plastic use as a whole.
Now, you may wonder if there is any effective way to reduce plastic pollution. 
One way is to improve waste management. (31)People in Europe, the United States, 
Japan, and South Korea are among the heaviest users of plastic. (32)They consume 
about one-third of the global total. (33)However, these countries are responsible for only 
around one percent of what flows into the ocean. (34)This is partly due to their systems 
for waste collection and disposal.
Waste management, however, is not so effective in many other countries in Asia, 
as well as in West Africa and Latin America. They are the plastic pollution hot spots of 
the world.
Ideally, every city in the world should have good garbage collection and disposal 
systems. But waste management is costly. Improving systems could take many years. 
In the meantime, thousands of tons of plastic continue to flow into the ocean every day 
through rivers. Lesson 4 
We looked at more than 100,000 of the world’s rivers. We found that nearly 80 
percent of all plastic flowing into the ocean comes from just 1,000 of those rivers: just 
one percent.
This fact pointed us toward a better way to clean the oceans. (35)While we wait 
for the world to build better waste management systems, we can focus on rivers. We can 
turn off the tap.
The Ocean Cleanup is already working on 10 rivers in countries like Indonesia, 
Malaysia, Vietnam, the Dominican Republic, and the United States.
Our latest site is the Río Motagua in Guatemala. In the first three weeks alone, 
we collected 816 tons of trash. (36)Of this amount, 272 tons was plastic. This is more 
than all of the plastic waste that flows into the ocean from France in one year.
Plastic pollution harms the environment, damages the economy, and can 
threaten the health of people in coastal areas. (37)Plastic is one of the biggest threats 
our oceans face today.
Reducing plastic use is good for the environment, but it is difficult. This 
doesn’t mean that there is nothing we can do about it. We know effective solutions 
exist.
Collecting plastic in rivers is the most economical method to reach our goal. 
But there is no time to waste. Lesson 4 
(38)Jane Goodall is famous not only for her work with chimpanzees but also for her effort to conserve 
nature. Here, Ken interviews her about her life and work.
Ken : Dr. Goodall, thank you for taking time for this interview. I know that you spent many years 
studying chimpanzees in Africa. When did you first decide to go to Africa?
Jane : It was after I read the Doctor Dolittle and the Tarzan books. When I was 11, I knew that 
somehow I would go to Africa to live with animals, study them, and write books about them.
Ken : I’m sure there are lots of young people who want to work with animals someday. How can 
they prepare themselves?
Jane : There are a lot of things you can do in order to understand animals. It is very important 
that you watch them and observe their behavior. It is also important that you write notes and ask 
questions. If you are really determined, you’ll have to work really hard. Take advantage of every 
opportunity, and don’t give up.
Ken : You did a lot of fieldwork, observing chimpanzees in the wild. Are they in any way like 
humans?
Jane : (39)Chimps and humans have a lot in common, sharing 98.6 percent of DNA. Their brains 
are very much like ours and much of their behavior is like ours. The members of a chimp family are 
very close, often helping one another. They can feel sad, happy, afraid, and angry.
Ken : What about their character—I mean, are they friendly? Are they cruel?
Jane : They are usually friendly, but they can be cruel, just like humans.
Ken : Really? Lesson 4 
Jane : The males sometimes attack chimps from another community to protect their territories. 
But they can be very kind and loving too. (40)Once, when he was about three years old, a chimp 
called Mel lost his mother and was left alone. We all thought he’d die. But, to our surprise, a 12-
year-old male chimp called Spindle took care of him.
Ken : In what way?
Jane : (41)Mel would ride on his back and share his nest at night. He shared his food if Mel asked 
for it. Chimps can indeed be loving and caring.
Ken : You travel all over the world, giving talks about the conservation of nature. Do you have 
any comment?
Jane : (42)Yes, we humans must understand that wild animals have the right to live. They need 
wild places. Besides, there are some kinds of living things that we must not destroy. Many drugs 
for human diseases come from plants and insects. (43)When we destroy a wild area, maybe we are 
destroying the cure for cancer without knowing it.
Ken : I see.
Jane : Everything in nature is connected. Plants and animals make up a whole pattern of life. 
(44)If we destroy that pattern, all kinds of things can go wrong.
Ken : Could you say more about that?
Ken : Sure. One time in England, rabbits were destroying farmers’ grain. The farmers killed the 
rabbits. Then foxes didn’t have enough to eat and they started killing the farmers’ chickens. 
(45)The farmers then killed the foxes, and rats quickly increased in number and destroyed just as much 
grain as the rabbits had eaten. We humans are in danger of destroying our environment and 
ourselves along with it.
Ken : Are you worried about our future?
Jane : Yes, I am. (46)But my hope lies in young people. That’s why I started Roots & Shoots. It 
began with a group of high school students in Tanzania in 1991. (47)It is called Roots & Shoots 
because roots can work their way through rocks to reach water. And shoots can break through a wall 
to reach the sunlight. The rocks and wall are the problems humans have caused to our earth.
Ken : Is it a kind of club for young people?
Jane : Yes. We now have groups all over the world and each group chooses three projects: one to 
help people, one to help animals, one to help the environment. The world is a better place when a 
sad person smiles at you, when a dog wags its tail for you, or when you give water to a thirsty plant. 
(48)That’s what Roots & Shoots is all about.
Ken : Some final words?
Jane : (49)People should think about the consequences of the little choices they make each day. 
What to buy? What to eat? What to wear? You are just one person, but (50)what you do affects 
the whole world. The changes you make may be small, but if a thousand, then a million, finally a 
billion people all make those changes, this is going to make a big difference.
Ken : Dr. Goodall, thank you very much for sharing your ideas with us.`;

        function parseSentences(text) {
            let results = [];
            for (let i = 1; i <= 50; i++) {
                let marker = `(${i})`;
                let startIndex = text.indexOf(marker);
                if (startIndex === -1) continue;
                
                let contentStart = startIndex + marker.length;
                let subText = text.substring(contentStart);
                
                let sentence = "";
                if (i === 7) {
                    let firstDot = subText.indexOf('.');
                    if (firstDot !== -1) {
                        let secondSub = subText.substring(firstDot + 1);
                        let secondDot = secondSub.indexOf('.');
                        if (secondDot !== -1) {
                            sentence = subText.substring(0, firstDot + 1 + secondDot + 1);
                        } else {
                            sentence = subText;
                        }
                    } else {
                        sentence = subText;
                    }
                } else if (i === 11 || i === 19) {
                    let commaIdx = subText.indexOf(',');
                    if (commaIdx !== -1) {
                        sentence = subText.substring(0, commaIdx + 1);
                    } else {
                        sentence = subText;
                    }
                } else if (i === 18) {
                    let colonIdx = subText.indexOf(':');
                    if (colonIdx !== -1) {
                        sentence = subText.substring(0, colonIdx + 1);
                    } else {
                        sentence = subText;
                    }
                } else {
                    let dotIdx = subText.indexOf('.');
                    if (dotIdx !== -1) {
                        sentence = subText.substring(0, dotIdx + 1);
                    } else {
                        sentence = subText;
                    }
                }
                
                results.push({
                    number: i,
                    text: cleanText(sentence),
                    translation: translations[i] || ""
                });
            }
            return results;
        }

        const allSentences = parseSentences(rawText);

        function renderList(items) {
            const container = document.getElementById('sentence-list');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-[#49454f]">一致する文章が見つかりませんでした</div>';
                return;
            }

            items.forEach((item, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'md3-item p-5 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 animate-fade-in';
                wrapper.style.animationDelay = `${(index % 12) * 0.04}s`;

                const leftCol = document.createElement('div');
                leftCol.className = 'flex items-center space-x-4 w-full';

                const badge = document.createElement('span');
                badge.className = 'w-10 h-10 rounded-full bg-[#e8def8] text-[#1d1b20] font-medium text-sm flex items-center justify-center flex-shrink-0';
                badge.textContent = item.number;

                const textGroup = document.createElement('div');
                textGroup.className = 'flex flex-col space-y-1 w-full overflow-hidden';

                const enP = document.createElement('p');
                enP.className = 'text-base sm:text-lg font-normal text-[#1d1b20] leading-snug';
                enP.textContent = item.text;

                const jaP = document.createElement('p');
                jaP.className = 'text-sm sm:text-base font-normal text-[#49454f] leading-snug';
                jaP.textContent = item.translation;

                textGroup.appendChild(enP);
                textGroup.appendChild(jaP);

                leftCol.appendChild(badge);
                leftCol.appendChild(textGroup);

                wrapper.appendChild(leftCol);
                container.appendChild(wrapper);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderList(allSentences);

            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const filtered = allSentences.filter(item => 
                    item.text.toLowerCase().includes(query) || 
                    item.translation.toLowerCase().includes(query) ||
                    item.number.toString() === query
                );
                renderList(filtered);
            });
        });
    </script>
</body>
</html>
